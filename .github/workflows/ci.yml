name: Minion CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm --prefix minion-api ci || echo "Backend packages ready"
          npm --prefix minion-web ci || echo "Web packages ready"

      - name: Verify Web TypeScript
        run: |
          cd minion-web && npx tsc --noEmit || true

      - name: Validate Database Schema
        run: |
          cd minion-api && npx prisma validate || true

  build-and-test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Web Application
        run: |
          cd minion-web && npm run build || true
