name: Minion CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'minion-web/package-lock.json'

      - name: Install Dependencies
        run: |
          npm --prefix minion-web install
          if [ -d "minion-api" ] && [ -f "minion-api/package.json" ]; then
            npm --prefix minion-api install || echo "Backend packages skipped"
          fi

      - name: Verify Web TypeScript
        run: |
          cd minion-web && npx tsc --noEmit || true

      - name: Validate Database Schema
        run: |
          if [ -d "minion-api" ] && [ -f "minion-api/package.json" ]; then
            cd minion-api && npx prisma validate || true
          fi

  build-and-test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'minion-web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          npm --prefix minion-web install

      - name: Build Web Application
        run: |
          npm --prefix minion-web run build
